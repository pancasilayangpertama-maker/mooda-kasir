name: Build MoodA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: HTML satu file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build single-file HTML
        run: node build-single.js

      - name: Upload MoodA-Single.html
        uses: actions/upload-artifact@v4
        with:
          name: MoodA-Single
          path: dist/MoodA-Single.html
          if-no-files-found: error
          retention-days: 90

  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Siapkan aset web
        run: npm run build:www

      - name: Tambah platform Android
        run: npx cap add android

      - name: Pasang plugin cetak Bluetooth
        run: |
          PKG=android/app/src/main/java/com/mooda/kasir
          mkdir -p "$PKG"
          cp native/android/MoodaPrinterPlugin.java "$PKG/"
          cp native/android/MainActivity.java "$PKG/"
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = p.read_text()
          if "BLUETOOTH_CONNECT" not in xml:
              perms = ["BLUETOOTH", "BLUETOOTH_ADMIN", "BLUETOOTH_CONNECT", "BLUETOOTH_SCAN"]
              out = []
              for n in perms:
                  cap = ' android:maxSdkVersion="30"' if n in ("BLUETOOTH", "BLUETOOTH_ADMIN") else ""
                  out.append('    <uses-permission android:name="android.permission.%s"%s />' % (n, cap))
              xml = xml.replace("</manifest>", "\n".join(out) + "\n</manifest>")
              p.write_text(xml)
          print("manifest: izin Bluetooth siap")
          PY

      - name: Sinkron aset ke Android
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoodA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
