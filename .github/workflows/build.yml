name: Build MoodA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build single-file HTML
        run: node build-single.js

      - name: Upload MoodA-Single.html
        uses: actions/upload-artifact@v4
        with:
          name: MoodA-Single
          path: dist/MoodA-Single.html
          if-no-files-found: error
          retention-days: 90
